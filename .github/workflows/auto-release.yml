name: Auto Release

# Automatically creates or updates a GitHub Release whenever changes
# are pushed to master. Release name follows the format "Mogoi-AI <version>".

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: |
          VER=$(jq -r .version package.json)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mogoi-AI ${{ steps.version.outputs.version }}"
          body: |
            ### Automatic Release

            Auto-generated from push to `master`.

            Version: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          tag_name: "latest"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
